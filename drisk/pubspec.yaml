name: drisk
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core & DB
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.3.3
  intl: ^0.19.0
  google_fonts: ^6.2.1

  # UI & Charts
  fl_chart: ^0.68.0
  animated_background: ^2.0.0
  flutter_heatmap_calendar: ^1.0.5
  cupertino_icons: ^1.0.8

  # Export functionality
  csv: ^6.0.0
  share_plus: ^9.0.0
  path_provider: ^2.1.2
  file_picker: ^8.0.0+1

  # --- ADDED FOR AUDIO ---
  record: ^5.0.5
  audioplayers: ^6.0.0
  # -----------------------


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

dependency_overrides:
  record_linux: ^1.0.0

flutter:
  uses-material-design: true